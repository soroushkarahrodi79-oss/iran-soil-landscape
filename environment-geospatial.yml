# Canonical reproducible environment for the Iran Soil Landscapes pipeline.
# Built with Miniforge / conda-forge. Python 3.12 is the project runtime.
#
# Create with:
#   conda env create -f environment-geospatial.yml
# (or: mamba env create -f environment-geospatial.yml)
#
# MDB (Access) note: mdbtools is intentionally NOT pinned here. On native
# Windows it has no reliable conda-forge build and is not assumed appropriate.
# HWSD2.mdb is read via GDAL/OGR first; if that fails, a documented pure-Python
# fallback is used (see docs/HWSD_SCHEMA.md / docs/ENVIRONMENT_NOTE.md). No
# proprietary Office/Access install and no web converter are used.
name: iran-soil-geospatial
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal>=3.8
  - rasterio>=1.3
  - geopandas>=1.0
  - pyogrio>=0.9
  - shapely>=2.0
  - pyproj>=3.6
  - pandas>=2.2
  - numpy>=1.26
  - matplotlib>=3.8
  - pyyaml>=6.0
  - pytest>=8.0
